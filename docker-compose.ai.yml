services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-pull-embed:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    container_name: ollama-pull-embed
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 3 && ollama pull ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}"
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull-embed:
        condition: service_completed_successfully

volumes:
  ollama: {}