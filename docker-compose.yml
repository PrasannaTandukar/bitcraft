services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-pull-embed:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    container_name: ollama-pull-embed
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 3 && ollama pull qwen3-embedding:0.6b"
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  db:
    build: ./db
    container_name: agenticai-db
    environment:
      POSTGRES_DB: agenticai
      POSTGRES_USER: agenticai_user
      POSTGRES_PASSWORD: agenticai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agenticai_user -d agenticai" ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: agenticai-migrator
    working_dir: /repo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/repo/src
      - ./.config:/repo/.config
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=agenticai;Username=agenticai_user;Password=agenticai_password
    command: >
      sh -c "dotnet tool restore &&
             dotnet ef database update --project src/Bitcraft.Infrastructure --startup-project src/Bitcraft.Api"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: src/Bitcraft.Api/Dockerfile
    container_name: agenticai-backend
    ports:
      - "8000:8000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: qwen3-embedding:0.6b
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=agenticai;Username=agenticai_user;Password=agenticai_password
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-pull-embed:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: agenticai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ollama: {}
  postgres_data: {}