services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  db:
    build: ./db
    container_name: agenticai-db
    environment:
      POSTGRES_DB: agenticai
      POSTGRES_USER: agenticai_user
      POSTGRES_PASSWORD: agenticai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agenticai_user -d agenticai" ]
      interval: 5s
      timeout: 5s
      retries: 20
      
  migrator:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: agenticai-migrator
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=agenticai;Username=agenticai_user;Password=agenticai_password
    command: >
      sh -c "dotnet restore &&
             dotnet tool restore &&
             dotnet ef database update"
    restart: "no"

  backend:
    build: ./backend
    container_name: agenticai-backend
    ports:
      - "8000:8000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OLLAMA_BASE_URL: http://ollama:11434
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=agenticai;Username=agenticai_user;Password=agenticai_password
    depends_on:
      ollama:
        condition: service_started
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: agenticai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ollama: {}
  postgres_data: {}