services:
  tutor-studio:
    build:
      context: ./tutor-studio
      dockerfile: Dockerfile.prod
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    environment:
      ModelProviders__Ollama__BaseUrl: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"