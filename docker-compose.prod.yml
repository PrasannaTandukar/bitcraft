services:
  tutor-studio:
    build:
      context: ./tutor-studio
      dockerfile: Dockerfile.prod
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    # The backend reads model endpoints from the RuntimeEngines table (OD-4).
    extra_hosts:
      - "host.docker.internal:host-gateway"
