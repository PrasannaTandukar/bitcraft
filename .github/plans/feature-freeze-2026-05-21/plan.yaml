branch: feature-freeze-2026-05-21
created_at: 2026-05-19
updated_at: 2026-05-20
status: active
revision: v3.4
goal: >
  Freeze the Proof-of-Concept Product Core and Tutor Studio feature set before
  2026-05-21 on a production-grade entity-relational foundation: roles fixed in
  code (Admin/Editor/Auditor), tracked secrets via template.<name>.<ext>
  convention, polymorphic Model registry (TPH, capability-typed), resource
  membership for multi-owner Tutors, Document M:N with stackable virtual
  folders, dynamic embedding dimensions per embedding model, uniform
  TutorRevision versioning with derived TutorConfigurationSnapshot, local
  activation and separate runtime API aligned to revisions, and a benchmarking
  shell. Frontend work is carved out as a separate planning iteration
  (plan.frontend.md) and does not start before backend ERM is accepted.
