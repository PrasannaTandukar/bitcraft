validation_strategy:
  build:
    - dotnet build bitcraft.slnx
  test:
    - dotnet test tests/Bitcraft.UnitTests/Bitcraft.UnitTests.csproj
    - dotnet test tests/Bitcraft.ApiIntegrationTests/Bitcraft.ApiIntegrationTests.csproj
  compose_config:
    - all 6 combinations from S11
  human_smoke:
    - task up:dev on Windows (Docker Desktop / WSL2) -> backend healthy + tutor-studio HMR
    - task up:dev on macOS -> same
    - task up:ai-gpu on Linux + NVIDIA -> ollama serves on :11434
    - task up:ai-jetson on Jetson Orin -> chat + embed pulls complete
  intentionally_not_run:
    - Production deploy
    - DB migration apply
    - Live model inference benchmark

rollout:
  order:
    - Land S1 (backend health) first; this is the only code-shape change.
    - Land S2-S7 in any order on top; compose-only and env-only.
    - Land S8 after S2-S7 (launcher consumes them).
    - Land S9-S10 once shape is final.
    - Run S11 as gate before merging.
    - S12 last.
  smoke_tests:
    - Each owner runs the validation listed for their step.
    - Lead Dev runs S11 before requesting human merge.
  rollback:
    - All compose changes are additive or surgical; rollback = git checkout previous commit and `docker compose down && docker compose up -d`.
    - Backend /api/health is additive; no rollback risk.
    - Taskfile + run.ps1 additive; deleting them restores prior state.
    - db/Dockerfile deletion is recoverable from Git history.
