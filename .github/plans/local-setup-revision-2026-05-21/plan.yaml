summary: >-
  Make the Bitcraft local container stack work cohesively across Windows + Docker
  Desktop, macOS (Intel + Apple Silicon) + Docker Desktop, Linux + Docker Engine,
  Linux + NVIDIA GPU, and NVIDIA Jetson Orin (JetPack 6.x) from one compose set,
  one launcher surface, and one setup doc. Follow-on to the TutorRevision /
  dynamic-embedding / sidecar-UDS work just landed on
  feature-freeze/05-tutor-document-mn.

goals:
  - One compose set + one docs page covers all 5 supported local environments.
  - Backend exposes a real HTTP healthcheck and tutor-studio waits on it before starting.
  - Jetson compose is buildable, current, and feature-complete (chat model pull + healthcheck + arm64 platform pin).
  - Cross-platform launcher (Taskfile primary, run.sh + run.ps1 as safety nets) replaces the bash-only run.sh.
  - .env.example documents every variable the stack reads (chat model, embed dims, vite polling).
  - Tutor Studio supports host hot-reload on Win/Mac/Linux without manual rebuilds.

non_goals:
  - Web stack feature work (D25 step 9).
  - Production deployment, CI/CD, or release automation.
  - Database migrations (tracked in dev-ops inbox separately).
  - Secrets management / JWT rotation (tracked elsewhere).
  - Renaming compose files to compose.yaml (style-only, defer).
  - pgvector image major bump pg17 -> pg18 (destructive local data reset; deferred as separate human decision).
  - Any Git config change (.gitattributes, .gitignore).

human_decisions:
  - id: HD-1
    title: pgvector image version
    detail: >-
      Stay on pgvector/pgvector:pg17 (recommended, no local data reset) vs bump
      to pg18-trixie (cleaner long-term, invalidates every developer's local DB
      volume).
    recommendation: stay on pg17 for this batch; schedule pg18 as a separate planned migration.
  - id: HD-2
    title: Orphaned db/Dockerfile
    detail: >-
      Delete db/Dockerfile (drift: compose pins pgvector image directly and
      never builds this) vs keep with a header comment for one more release.
    recommendation: delete.
  - id: HD-3
    title: Launcher strategy
    detail: >-
      Adopt Taskfile (taskfile.dev) as primary cross-platform launcher and keep
      revamped run.sh + new run.ps1 as safety nets, vs shell-only (run.sh +
      run.ps1) with no Taskfile.
    recommendation: Taskfile primary + both shell launchers as fallback.
  - id: HD-4
    title: .gitattributes LF normalization
    detail: >-
      Add LF normalization for *.sh, *.sql, docker-compose*.yml, Taskfile.yml so
      Windows checkouts don't corrupt shell scripts. Touches Git config -> human approval required.
    recommendation: approve in a follow-up commit; out of scope for this plan's automated work.
  - id: HD-5
    title: Backend /api/health endpoint shape
    detail: >-
      Confirm whether to use AspNetCore.HealthChecks (rich, with DB + sidecar
      probes) or a trivial inline minimal-API endpoint returning 200. Used by
      compose healthcheck only at this stage.
    recommendation: trivial endpoint now (200 + version JSON); rich health checks deferred.

steps:
