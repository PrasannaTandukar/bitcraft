    title: Backend /api/health endpoint
    owner: net-dev
    depends_on: []
    risk: low
    human_lock: false
    outputs:
      - modify: src/Bitcraft.Api/Program.cs (or new Controllers/HealthController.cs)
      - add: tests/Bitcraft.ApiIntegrationTests covering GET /api/health -> 200
    validation:
      - dotnet build bitcraft.slnx
      - dotnet test tests/Bitcraft.ApiIntegrationTests/Bitcraft.ApiIntegrationTests.csproj
    notes: >-
      Minimal-API endpoint that returns 200 with { status: "ok", version: <assembly version> }.
      No DB or sidecar probe yet (HD-5).

  - id: S2
