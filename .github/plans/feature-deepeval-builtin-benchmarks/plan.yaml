goal: >
  Introduce standard zero-sandbox DeepEval benchmarks (MMLU, GSM8K, BBH, HellaSwag, DROP, TruthfulQA),
  clear architectural separation between model continuous evaluation metrics and systematic task benchmarking,
  deterministic-first scoring with transparent observability, and extensible multi-modal Arduino evaluation skeleton.
