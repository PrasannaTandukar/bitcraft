locked_decisions:
  - Exclude HumanEval from initial execution set to avoid code sandbox overhead/risk; prioritize zero-sandbox standard benchmarks (MMLU, GSM8K, BBH, HellaSwag, DROP, TruthfulQA).
  - Strict UI and telemetry separation between continuous Model Evaluation (model quality baseline, performance stats) and Systematic Tutor Benchmarking (task suites, test cases, revision snapshots).
  - Deterministic metrics (token/claim overlap, latency, tokens/sec, PII regex, keyword guards) are enabled and displayed by default for 100% explainable, reproducible scoring. Non-deterministic / LLM-as-a-judge (G-Eval rubrics, semantic faithfulness) are clearly tagged as qualitative/probabilistic overlays.
  - Multi-step Arduino benchmark skeleton requires 4 sub-scores: Object/Detail Detection, Circuit/Wiring Understanding, Problem Solution/Reasoning, and Guidance Quality.
human_locks:
  - Standard benchmark datasets caching location and download trigger.
  - Default LLM judge provider connection for non-deterministic metric evaluation.
