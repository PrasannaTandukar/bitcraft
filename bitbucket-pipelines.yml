image: atlassian/default-image:5

pipelines:
  branches:
    'deploy/orin':
      - step:
          name: Test SSH to Jetson

          runs-on:
            - self.hosted
            - linux.arm64
            - bitcraft.jetson

          script:
            - echo "Preparing SSH"
            - mkdir -p ~/.ssh
            - chmod 700 ~/.ssh
            - 'printf "%s\n" "$JETSON_HOST_KEY" >> ~/.ssh/known_hosts'
            - chmod 600 ~/.ssh/known_hosts

            - echo "Connecting to Jetson"

            - 'ssh -o BatchMode=yes "$JETSON_USER@$JETSON_HOST" "echo SSH_CONNECTION_SUCCESS && hostname && uname -m"'