image: atlassian/default-image:5

pipelines:
  branches:
    'deploy/orin':
      - step:
          name: Verify Jetson Docker Access

          runs-on:
            - self.hosted
            - linux.arm64
            - bitcraft.jetson

          runtime:
            self-hosted:
              volumes:
                - "/var/run/docker.sock:/var/run/docker.sock"

          script:
            - echo "Architecture:"
            - uname -m

            - echo "Docker:"
            - docker version

            - echo "Docker Compose:"
            - docker compose version

            - echo "Current Jetson containers:"
            - docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"