image: atlassian/default-image:5

pipelines:
  branches:
    'deploy/orin':
      - step:
          name: Test Docker on Jetson

          runs-on:
            - self.hosted
            - linux.arm64
            - bitcraft.jetson

          script:
            - mkdir -p ~/.ssh
            - chmod 700 ~/.ssh
            - 'printf "%s\n" "$JETSON_HOST_KEY" >> ~/.ssh/known_hosts'
            - chmod 600 ~/.ssh/known_hosts
            - echo "Testing Docker access on Jetson"

            - >
              ssh -o BatchMode=yes "$JETSON_USER@$JETSON_HOST"
              "echo DOCKER_TEST_START &&
              docker version &&
              docker compose version &&
              docker ps &&
              echo DOCKER_TEST_SUCCESS"