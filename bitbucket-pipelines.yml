image: atlassian/default-image:5

# ADJUST THESE to match your actual repo layout
definitions:
  steps:
    - step: &scan-secrets
        name: "Secret scan (gitleaks)"
        #runs-on: ubuntu-latest
        image: zricethezav/gitleaks:latest
        clone:
          depth: full
        script:
          - gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json
        artifacts:
          upload:
            - name: "gitleaks-report"
              paths:
                - gitleaks-report.json
              capture-on: always

    - step: &scan-frontend
        name: "Dependency scan — frontend (npm audit)"
        #runs-on: ubuntu-latest
        image: node:20
        script:
          - cd tutor-studio
          - npm ci
          # Save the raw report as an artifact regardless of pass/fail, then
          # enforce the threshold as a separate command so we don't lose the report on failure.
          - npm audit --json > npm-audit-report.json || true
          - npm audit --audit-level=high
        artifacts:
          upload:
            - name: "npm-audit-report"
              paths:
                - tutor-studio/npm-audit-report.json
              capture-on: always

    - step: &scan-backend
        name: "Dependency scan — backend (dotnet list package --vulnerable)"
        #runs-on: ubuntu-latest
        image: mcr.microsoft.com/dotnet/sdk:10.0
        script:
          - dotnet restore bitcraft.slnx
          # dotnet list package --vulnerable exits 0 even when it finds vulnerabilities,
          # so we capture the output and fail manually if any are reported.
          - |
            OUTPUT=$(dotnet list bitcraft.slnx package --vulnerable --include-transitive)
            echo "$OUTPUT"
            echo "$OUTPUT" > dotnet-vulnerable-report.txt
            if echo "$OUTPUT" | grep -qi "has the following vulnerable packages"; then
              echo "Vulnerable packages found — failing build."
              exit 1
            fi
        artifacts:
          upload:
            - name: "dotnet-vulnerable-report"
              paths:
                - dotnet-vulnerable-report.txt
              capture-on: always

    - step: &test-frontend
        name: "Test — frontend (npm)"
        #runs-on: ubuntu-latest
        image: node:20
        script:
          - cd tutor-studio
          - npm ci
          - npx vitest run --reporter=junit --outputFile=test-results/junit.xml
        artifacts:
          upload:
            - name: "frontend-test-report"
              type: "test-reports"
              paths:
                - tutor-studio/test-results/junit.xml
              capture-on: always

    - step: &test-backend
        name: "Test — backend (.NET)"
        #runs-on: ubuntu-latest
        image: mcr.microsoft.com/dotnet/sdk:10.0
        script:
          - dotnet restore bitcraft.slnx
          - dotnet add tests/Bitcraft.UnitTests package JUnitTestLogger --version 1.1.0
          - dotnet add tests/Bitcraft.ApiIntegrationTests package JUnitTestLogger --version 1.1.0
          - dotnet add tests/Bitcraft.InfrastructureIntegrationTests package JUnitTestLogger --version 1.1.0
          - dotnet test bitcraft.slnx --logger "console;verbosity=normal" --logger "junit;LogFilePath=../../test-results/{assembly}.xml"
        artifacts:
          upload:
            - name: "backend-test-report"
              type: "test-reports"
              paths:
                - test-results/*.xml
              capture-on: always

    - step: &deploy
        name: Deploy Bitcraft to Jetson
        runs-on:
          - self.hosted
          - linux.arm64
          - bitcraft.jetson
        script:
          - set -o pipefail
          - mkdir -p ~/.ssh
          - chmod 700 ~/.ssh
          - 'grep -qxF "$JETSON_HOST_KEY" ~/.ssh/known_hosts 2>/dev/null || printf "%s\n" "$JETSON_HOST_KEY" >> ~/.ssh/known_hosts'
          - chmod 600 ~/.ssh/known_hosts

          # Pin to the exact commit that triggered this pipeline run.
          - export DEPLOY_SHA="$BITBUCKET_COMMIT"

          - |
            ssh -o BatchMode=yes "$JETSON_USER@$JETSON_HOST" "bash -se" <<REMOTE 2>&1 | tee deploy.log
            set -euo pipefail

            cd /home/cmpe6012/AgenticTutor/bitcraft-deploy

            echo "Fetching..."
            git fetch origin deploy/orin

            echo "Deploying pinned commit: $DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            git log -1 --oneline

            echo "Starting Docker deployment..."
            sudo -n /usr/local/sbin/bitcraft-deploy

            echo "BITCRAFT_DEPLOYMENT_SUCCESS"
            REMOTE
        artifacts:
          upload:
            - name: "deploy-log"
              paths:
                - deploy.log
              capture-on: always

pipelines:
  branches:
    'deploy/orin':
      - parallel:
          - step: *scan-secrets
          - step: *scan-frontend
          - step: *scan-backend
      - parallel:
          - step: *test-frontend
          - step: *test-backend
      - step:
          <<: *deploy
          trigger: manual   # remove this line for a fully automatic deploy
