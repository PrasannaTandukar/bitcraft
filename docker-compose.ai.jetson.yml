services:
  ollama:
    # Pinned dustynv image for JetPack 6.x (L4T r36.4). Bump in lockstep with the host JetPack release.
    image: dustynv/ollama:0.6.8-r36.4-cu126-22.04
    platform: linux/arm64
    container_name: ollama
    runtime: nvidia
    network_mode: host

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /ollama
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

    volumes:
      - ollama:/ollama

    restart: unless-stopped

    # 🚨 HARD OVERRIDE
    entrypoint: [ "/usr/bin/ollama" ]
    command: [ "serve" ]

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama-pull-embed:
    image: dustynv/ollama:0.6.8-r36.4-cu126-22.04
    platform: linux/arm64
    container_name: ollama-pull-embed
    network_mode: host

    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_MODELS: /ollama

    volumes:
      - ollama:/ollama

    # 🚀 no shell = no bug
    entrypoint: [ "ollama" ]
    command: [ "pull", "${OLLAMA_EMBED_MODEL:-nomic-embed-text}" ]

    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  ollama-pull-chat:
    image: dustynv/ollama:0.6.8-r36.4-cu126-22.04
    platform: linux/arm64
    container_name: ollama-pull-chat
    network_mode: host

    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_MODELS: /ollama

    volumes:
      - ollama:/ollama

    entrypoint: ["ollama"]
    # Jetson default skews to the smaller llama3.2:1b; override via OLLAMA_CHAT_MODEL on Orin AGX / Orin Nano Super.
    command: ["pull", "${OLLAMA_CHAT_MODEL:-llama3.2:1b}"]

  backend:
    # The backend reads model endpoints from the RuntimeEngines table (OD-4).
    # OLLAMA_CHAT_MODEL/OLLAMA_EMBED_MODEL stay in use by the ollama-pull-* services above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull-embed:
        condition: service_completed_successfully
      ollama-pull-chat:
        condition: service_completed_successfully

volumes:
  ollama: {}
